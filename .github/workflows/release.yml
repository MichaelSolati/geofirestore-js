name: Release CI
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: NPM Install
        run: npm install
      - name: Build
        run: npm run build
      - name: NPM Publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}